<!DOCTYPE html>
<html>

<head>
    <title>images</title>
</head>

<body>
    <h1>how to show images on html</h1>

    <!-- image tag -->
    <p>good image</p>
    <img src="https://images.pexels.com/photos/674010/pexels-photo-674010.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1"
        alt="image not available">

    <!-- relative image url (by saving it in same folder) -->
    <p>relative image</p>
    <img src="/4.1 exp.jpeg" alt="not available">

    <!-- introducing width and height attribute -->
    <img src="/4.1 exp.jpeg" alt="not available" width="150px" height="100px">

    <!-- subscript amd superscript tags -->
    <p>CO <SUB>2</SUB> +H<sub>2</sub>O=H<sub>2</sub>SO<sub>4</sub></p>
    <p>ax<sup>2</sup>+bx+c</p>

    <!-- preserve tag (pre tag) to preserve whatever is written as it is, not removing any extra line or space -->
    this is me tushar
    i love coding
    i am very much lucky
    <pre>
this is me tushar
    i love coding
i am very much lucky
</pre>


</body>

</html>
