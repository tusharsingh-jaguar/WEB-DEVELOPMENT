<!DOCTYPE html>
<html>

<head>
    <title>bold italic and underlined</title>
</head>

<body>
    <!-- bold italic and underlined -->
    <p>bold</p>
    <b>this is bold</b>
    <p>italic</p>
    <i>this is italic</i>
    <p>underlined</p>
    <u>this is underlined</u>
    <p>this is all</p>
    <b><i><u>this is all</u></i></b>
</body>

</html>
