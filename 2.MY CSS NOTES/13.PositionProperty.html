<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Property</title>
    <!-- Position property is sattic by default means we cannot apply top, bottom etc. on it -->
    <!-- Types of position property generally - relative, absolute, fixed, stiky, etc. -->
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            border: 2px solid black;
            width: 60vw;
            height: 20vh;
            margin: 5px;
            padding: 5px;
        }

        .box1 {
            background-color: red;
            position: relative;
            z-index: 1;
            /* after making this change the yellow box will go below to red box */
        }

        .box2 {
            background-color: yellow;
            position: relative;
            /* means the box will only change its position and it will not affect any other box position. */
            top: -20px;
            left: 40px;
        }

        /* The CSS position: absolute property removes an element from the normal document flow and positions it relative to its nearest positioned ancestor (any ancestor with a position value other than the default static). If no such ancestor exists, it is positioned relative to the initial containing block (usually the <html> or <body> element).  */

        .box3 {
            background-color: burlywood;
            position: absolute;
            /* when we put box3 in absolute it comes up to box4 and covers it */
            /* now, box3 is having a parent and it will be on top of it */
            /* but if we put its top:0px; then it will go on top of the viewport */
            top: 0px;
            /* it will go for its nearest positioned element in this case div with "parent" class is not positioned as its position is static only and same for body, so it will go relative to html tag */
        }

        .box4 {
            background-color: orange;
        }

        .box5 {
            background-color: rgb(47, 8, 222);
        }

        .parent {
            padding: 10px;
            margin: 10px;
            border: 5px solid black;
        }

        .box6 {
            background-color: rgb(0, 255, 234);
            position: absolute;
            z-index: 1;
            /* now its parent1 is also a absolute positioned element, so, it box6 will now aplly its position in order to parent1 */
            
            /* Exception: transform, filter, or perspective properties can also make an element appear as positioned */
            /* transform: translate(0); */
            /* filter: invert(0); */
            /* perspective: 0em; */
        }

        .box7 {
            background-color: rgb(222, 8, 222);
            position: relative;
            left: 30px;
        }

        .box8 {
            background-color: rgb(211, 222, 8);
        }


        .parent1 {
            padding: 10px;
            margin: 10px;
            border: 5px solid black;
            position: absolute;
        }

        .fixedbox {
            background-color: rgb(8, 222, 76);
            position: fixed;
            right: 0px;
            bottom: 0px;
            /* this can be used to create advertisment */
        }

        .stickybox {
            background-color: rgb(22, 129, 169);
            position: sticky;
            top: 0px;
            /* after coming top at 0px it will stick from top and goes down with it */
            /* it is generally taken in nav bar as we don't want it to go up with scrolling down. */
        }

        .box9 {
            background-color: rgb(42, 135, 41);
        }

        .box10 {
            background-color: rgb(42, 135, 41);
        }

        .box11 {
            background-color: rgb(42, 135, 41);
        }

        .box12 {
            background-color: rgb(42, 135, 41);
        }

        .box13 {
            background-color: rgb(42, 135, 41);
        }

        .box14 {
            background-color: rgb(42, 135, 41);
        }

        .parent2 {
            padding: 10px;
            margin: 11px;
            border: 5px solid black;
            position: relative;
            top: 500px;
        }
    </style>
</head>

<body>
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="parent">
        <div class="box box3"></div>
        <div class="box box4"></div>
        <div class="box box5"></div>
    </div>
    <div class="parent1">
        <div class="box box6"></div>
        <div class="box box7"></div>
        <div class="box box8"></div>
    </div>
    <div class="box fixedbox"></div>
    <div class="parent2">
        <div class="box stickybox"></div>
        <div class="box box9"></div>
        <div class="box box10"></div>
        <div class="box box11"></div>
        <div class="box box12"></div>
        <div class="box box13"></div>
        <div class="box box14"></div>
    </div>
</body>

</html>
