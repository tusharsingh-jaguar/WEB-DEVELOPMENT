<!-- 
 Absolute : px, pt, pc, cm, mm, in
 Relative : %, em, Rem, ch, vh, vw + many more.
-->
<!-- 
  px : most common absolute unit
  96px = 1 inch
  not suitable for responsive websites 
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Sizing Units</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        /* html {
            font-size: 12px;
        } */

        /* html is a root element */
        .box {
            box-sizing: border-box;
            border: 2px solid black;
            background-color: aquamarine;
            /* width:500px;  */
            /* if we give width in px and we give 1080 px then in a monitor with resolution of 1080x1960 will cover full but in lower resolution like 720p monitor it will show scrollbar and website faat jayegii */
            /* so we use vw(viewport width) rather than px */
            width: 80vw;
            height: 20vh;
            /*vh - viewport height*/
            /* means it will take 80% width of your viewport */
            margin: auto;
            /* means if you want to center your text it will automatically apply equal margins to both ends */
        }

        .container {
            box-sizing: border-box;
            border: 2px solid black;
            background-color: aquamarine;
            width: 80vw;
            height: 80vh;
            margin: 23px auto;
            /*above and below 23px margin and left right auto margin*/
            font-size: 18px;
        }

        .container p {
            font-size: 1.5em;
            /*means its font-size is going to be 1.5 times the size it was going to inherit.*/
            font-size: 2rem;
            /*means its font-size is going to be 2 times the size of root element.*/
        }
    </style>
</head>

<body>
    <div class="box">
        <p>this is me.</p>
    </div>
    <div class="container">
        <p>this is also me.</p>
    </div>
</body>

</html>
